name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Unit tests (replay every trade in the bundled sample)
        run: python -m unittest discover tests -v
      - name: Backtest on the sample, end to end
        run: |
          python -c "from pumpfun.sample import ensure_sample; print(ensure_sample())"
          pumpfun sim --db data/sample.db --strategy launch_sniper --baseline --hold-minutes 5 --entry-window-minutes 5
